<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Air Chords — hand-tracked chord wheel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #090b10;
    --panel: rgba(16,20,28,0.72);
    --panel-border: rgba(255,255,255,0.08);
    --ink: #eef1f6;
    --ink-dim: #8b93a4;
    --cyan: #5fe3d3;
    --cyan-soft: rgba(95,227,211,0.18);
    --violet: #9b8cf9;
    --amber: #f2b84b;
    --danger: #f2725c;
    --mono: 'Space Mono', 'SF Mono', Menlo, monospace;
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--sans); overflow:hidden; -webkit-tap-highlight-color:transparent;
  }

  #stage{
    position:relative; width:100vw; height:100vh; height:100dvh;
    background:radial-gradient(ellipse at 50% 30%, #10141c 0%, #06070b 75%);
    overflow:hidden;
  }

  video{ display:none; }

  canvas#view{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:cover;
  }

  /* ---------- chord wheel: frosted-glass DOM overlay ---------- */
  #wheelGlass{
    position:absolute; border-radius:50%; z-index:2; pointer-events:none;
    background: rgba(8,10,15,0.40);
    backdrop-filter: blur(20px) saturate(1.1);
    -webkit-backdrop-filter: blur(20px) saturate(1.1);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 10px 34px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.02);
    opacity:0; transition:opacity .3s ease;
  }
  #wheelGlass.show{ opacity:1; }

  #wheelBox{
    position:absolute; z-index:3; pointer-events:none;
    opacity:0; transition:opacity .3s ease;
  }
  #wheelBox.show{ opacity:1; }
  #wheelSvg{ width:100%; height:100%; display:block; overflow:visible; }

  .wedge{
    fill:rgba(255,255,255,0.035); stroke:rgba(255,255,255,0.12); stroke-width:1;
    transition:fill .15s ease, stroke .15s ease, stroke-width .15s ease;
  }
  .wedge.selected{ fill:rgba(95,227,211,0.16); stroke:rgba(95,227,211,0.9); stroke-width:2.5; }
  .wedge.selected.active{ fill:rgba(95,227,211,0.4); }

  .wheelLabel{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:23px;
    fill:rgba(238,241,246,0.72); text-anchor:middle; dominant-baseline:central;
    transition:fill .15s ease, font-size .15s ease;
  }
  .wheelLabel.selected{ fill:#eafffb; font-size:29px; }
  .wheelLabel.selected.active{ fill:#c8fff6; filter:drop-shadow(0 0 7px rgba(95,227,211,0.7)); }

  #needleLine, #needleDot{ stroke:var(--amber); fill:var(--amber); transition:stroke .15s ease, fill .15s ease; }
  #needle.active #needleLine, #needle.active #needleDot{ stroke:var(--cyan); fill:var(--cyan); }
  #progressRing{ stroke:var(--amber); transition:stroke .15s ease; }
  #progressRing.active{ stroke:var(--cyan); }

  /* ---------- top status bar ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px 16px;
    z-index:5;
    background:linear-gradient(to bottom, rgba(6,7,11,0.85), rgba(6,7,11,0));
    pointer-events:none;
  }
  #brand{
    display:flex; align-items:baseline; gap:8px;
  }
  #brand .mark{
    width:9px; height:9px; border-radius:50%;
    background:var(--ink-dim);
    box-shadow:0 0 0 3px rgba(255,255,255,0.05);
    transition:background .2s, box-shadow .2s;
  }
  #brand .mark.live{ background:var(--cyan); box-shadow:0 0 0 4px var(--cyan-soft); }
  #brand h1{
    font-size:15px; margin:0; font-weight:600; letter-spacing:0.02em;
  }
  #brand span.sub{
    font-family:var(--mono); font-size:10px; color:var(--ink-dim); letter-spacing:0.08em;
  }
  #handStatus{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    text-align:right; letter-spacing:0.04em;
  }

  /* ---------- HUD readout chip (top-left over hand, mimics reference) ---------- */
  #readout{
    position:absolute; z-index:6; left:16px; top:64px;
    display:flex; gap:8px; pointer-events:none;
    opacity:0; transform:translateY(-6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #readout.show{ opacity:1; transform:translateY(0); }
  .chip{
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius:10px; padding:7px 12px;
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    letter-spacing:0.06em; text-transform:uppercase;
  }
  .chip b{
    display:block; font-family:var(--sans); font-size:17px; color:var(--ink);
    font-weight:700; letter-spacing:0; text-transform:none; margin-top:2px;
  }
  .chip.playing b{ color:var(--cyan); }
  .chip.playing{ border-color:rgba(95,227,211,0.4); }

  /* ---------- bottom control dock ---------- */
  #dock{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    padding: 8px 12px max(10px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(6,7,11,0.92), rgba(6,7,11,0));
  }
  #dockPanel{
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius:14px; padding:9px 11px;
    display:flex; flex-direction:column; gap:8px;
  }
  #dockRow{
    display:flex; align-items:center; gap:7px;
  }
  #startBtn{
    flex:1; border:none; border-radius:10px; padding:9px 12px;
    font-family:var(--sans); font-weight:600; font-size:12.5px;
    background:var(--cyan); color:#04211d; cursor:pointer;
    transition:transform .12s ease, background .2s ease;
  }
  #startBtn:active{ transform:scale(0.97); }
  #startBtn.stop{ background:var(--danger); color:#2a0a05; }
  #startBtn:disabled{ background:#333a45; color:#7a8290; }

  .songSelectWrapper{ position:relative; flex:1; min-width:0; }
  #songSelect{
    width:100%; appearance:none; -webkit-appearance:none;
    background:rgba(255,255,255,0.05); color:var(--ink);
    border:1px solid var(--panel-border); border-radius:10px;
    padding:9px 28px 9px 11px;
    font-family:var(--sans); font-size:12px; font-weight:600;
    cursor:pointer; outline:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:border-color .2s ease, background .2s ease;
  }
  #songSelect:hover{ background:rgba(255,255,255,0.08); border-color:rgba(95,227,211,0.4); }
  #songSelect:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-soft); }
  #songSelect option{ background:#10141c; color:#eef1f6; font-weight:500; }
  .songSelectWrapper::after{
    content:"⌄"; position:absolute; right:10px; top:50%; transform:translateY(-58%);
    color:var(--cyan); font-size:14px; pointer-events:none;
  }

  .iconBtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.03); color:var(--ink); font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; transition:background .15s ease, border-color .15s ease;
  }
  .iconBtn.active{ border-color:var(--cyan); color:var(--cyan); background:var(--cyan-soft); }

  #sliderRow{ display:flex; align-items:center; gap:8px; }
  #sliderRow label{
    font-family:var(--mono); font-size:9px; color:var(--ink-dim);
    letter-spacing:0.06em; text-transform:uppercase; width:64px; flex-shrink:0;
  }
  input[type=range]{
    flex:1; appearance:none; -webkit-appearance:none; height:3px; border-radius:2px;
    background:linear-gradient(to right, var(--cyan) 0%, var(--cyan) var(--fill,50%), rgba(255,255,255,0.12) var(--fill,50%));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; border:2.5px solid var(--cyan); cursor:pointer; margin-top:-5px;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; background:#fff; border:2.5px solid var(--cyan); cursor:pointer;
  }
  input[type=range]::-moz-range-track{ height:3px; border-radius:2px; background:rgba(255,255,255,0.12); }

  #legend{
    display:flex; flex-wrap:wrap; gap:4px 7px; padding-top:1px;
  }
  #legend .tag{
    font-family:var(--mono); font-size:9px; letter-spacing:0.03em;
    color:var(--ink-dim); padding:2px 6px; border-radius:5px;
    border:1px solid var(--panel-border);
  }
  #legend .tag.on{ color:var(--cyan); border-color:rgba(95,227,211,0.5); background:var(--cyan-soft); }

  /* ---------- centered placeholder / permission prompt ---------- */
  #placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:32px; z-index:4;
  }
  #placeholder h2{ font-size:22px; margin:0; font-weight:700; }
  #placeholder p{ font-size:13px; color:var(--ink-dim); max-width:280px; line-height:1.6; margin:0; }
  #placeholder .ring{
    width:64px; height:64px; border-radius:50%; border:2px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  #errBox{
    display:none; margin-top:6px; font-family:var(--mono); font-size:11px;
    color:var(--danger); max-width:280px; line-height:1.5;
  }

  #loadingBar{
    position:absolute; top:0; left:0; height:2px; background:var(--cyan); width:0%;
    z-index:7; transition:width .3s ease; box-shadow:0 0 8px var(--cyan);
  }

  ::selection{ background:var(--cyan-soft); }
</style>
</head>
<body>

<div id="stage">
  <div id="loadingBar"></div>
  <video id="cam" playsinline muted></video>
  <canvas id="view"></canvas>

  <div id="wheelGlass"></div>
  <div id="wheelBox">
    <svg id="wheelSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <g id="wedges"></g>
      <circle id="hub" cx="150" cy="150" r="70" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle id="progressRing" cx="150" cy="150" r="62" fill="none" stroke-width="4.5" stroke-linecap="round"
        transform="rotate(-90 150 150)" stroke-dasharray="389.6" stroke-dashoffset="389.6"/>
      <g id="labels"></g>
      <g id="needle">
        <line id="needleLine" x1="150" y1="127.6" x2="150" y2="84.2" stroke-width="3" stroke-linecap="round"/>
        <circle id="needleDot" cx="150" cy="84.2" r="4.5"/>
        <circle cx="150" cy="150" r="4" fill="rgba(255,255,255,0.85)"/>
      </g>
    </svg>
  </div>

  <div id="topbar">
    <div id="brand">
      <div class="mark" id="liveMark"></div>
      <div>
        <h1>Air Chords</h1>
      </div>
    </div>
    <div id="handStatus">no hand</div>
  </div>

  <div id="readout">
    <div class="chip" id="chordChip">CHORD<b id="chordVal">—</b></div>
    <div class="chip" id="openChip">R · OPEN<b id="openVal">0%</b></div>
  </div>

  <div id="placeholder">
    <div class="ring">✋</div>
    <h2>Air Chords</h2>
    <p>Point your right index finger around the wheel to pick a chord. Open your palm to play it — close your fist to mute.</p>
    <div id="errBox"></div>
  </div>

  <div id="dock">
    <div id="dockPanel">
      <div id="dockRow">
        <button id="startBtn">Start camera</button>
        <div class="songSelectWrapper">
          <select id="songSelect">
            <option selected>It's Beginning to Look a Lot Like Christmas</option>
            <option>Let It Be</option>
            <option>Perfect</option>
            <option>Shuudertsetseg</option>
            <option>4 uliral</option>
            <option>Riptide</option>
          </select>
        </div>
        <button class="iconBtn" id="muteBtn" title="Mute">🔊</button>
        <button class="iconBtn" id="skeletonBtn" title="Toggle hand skeleton">✋</button>
      </div>
      <div id="sliderRow">
        <label>Open thresh</label>
        <input type="range" id="threshSlider" min="20" max="80" value="50" />
      </div>
      <div id="legend"></div>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ============================= CONFIG ============================= */

// Each song defines its own set of chords, arranged clockwise from 12 o'clock.
// WHEEL always points at the currently selected song's chord list.
const SONGS = {
  "It's Beginning to Look a Lot Like Christmas": [
    { name: "Db",      midi: [49,53,56] },
    { name: "Gb",      midi: [54,58,61] },
    { name: "F",       midi: [53,57,60] },
    { name: "Bb7",     midi: [58,62,65,68] },
    { name: "Ebm",     midi: [51,54,58] },
    { name: "Ab7",     midi: [56,60,63,66] },
    { name: "Ebm/Bb",  midi: [58,63,66,70] },
    { name: "Ab",      midi: [56,60,63] },
  ],
  "Let It Be": [
    { name:"C",  midi:[48,52,55] },
    { name:"G",  midi:[55,59,62] },
    { name:"Am", midi:[57,60,64] },
    { name:"F",  midi:[53,57,60] },
  ],
  "Perfect": [
    { name:"G",  midi:[55,59,62] },
    { name:"Em", midi:[52,55,59] },
    { name:"C",  midi:[48,52,55] },
    { name:"D",  midi:[50,54,57] },
  ],
  "Shuudertsetseg": [
    { name:"E",   midi:[52,56,59] },
    { name:"C#m", midi:[49,52,56] },
    { name:"G#m", midi:[56,59,63] },
    { name:"F#m", midi:[54,57,61] },
    { name:"Am",  midi:[57,60,64] },
    { name:"B",   midi:[59,63,66] },
    { name:"A",   midi:[57,61,64] },
  ],
  "4 uliral": [
    { name:"Bm",  midi:[59,62,66] },
    { name:"F#m", midi:[54,57,61] },
    { name:"Em",  midi:[52,55,59] },
    { name:"G",   midi:[55,59,62] },
    { name:"A",   midi:[57,61,64] },
    { name:"C",   midi:[48,52,55] },
  ],
  "Riptide": [
    { name:"Am", midi:[57,60,64] },
    { name:"G",  midi:[55,59,62] },
    { name:"C",  midi:[48,52,55] },
  ],
};
let currentSong = "It's Beginning to Look a Lot Like Christmas";
let WHEEL = SONGS[currentSong];

const OPEN_ON  = 0.55; // hysteresis: fraction crossing to trigger "open"
const OPEN_OFF = 0.45; // hysteresis: fraction crossing to trigger "closed"
const SEGMENT_HOLD_FRAMES = 3; // debounce for chord-segment switching

/* ============================= DOM ============================= */

const video       = document.getElementById('cam');
const canvas      = document.getElementById('view');
const ctx         = canvas.getContext('2d');
const startBtn    = document.getElementById('startBtn');
const muteBtn     = document.getElementById('muteBtn');
const skeletonBtn = document.getElementById('skeletonBtn');
const threshSlider= document.getElementById('threshSlider');
const placeholder = document.getElementById('placeholder');
const errBox      = document.getElementById('errBox');
const loadingBar  = document.getElementById('loadingBar');
const liveMark    = document.getElementById('liveMark');
const handStatus  = document.getElementById('handStatus');
const readout     = document.getElementById('readout');
const chordChip   = document.getElementById('chordChip');
const openChip    = document.getElementById('openChip');
const chordVal    = document.getElementById('chordVal');
const openVal     = document.getElementById('openVal');
const legend      = document.getElementById('legend');
const songSelect  = document.getElementById('songSelect');

WHEEL.forEach(c=>{
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = c.name;
  tag.dataset.name = c.name;
  legend.appendChild(tag);
});

songSelect.addEventListener('change', ()=>{
  currentSong = songSelect.value;
  WHEEL = SONGS[currentSong];

  // stop whatever's currently sounding — it belongs to the old song
  if(isOpen){
    stopChordVoice(currentVoice, 0.15);
    currentVoice = null;
    currentChordName = null;
    isOpen = false;
  }

  // reset selection state so nothing points at a stale/out-of-range index
  lastSegmentIdx = null;
  candidateSegmentIdx = null;
  candidateCount = 0;
  lastRenderedIdx = null;

  // rebuild the legend chips
  legend.innerHTML = '';
  WHEEL.forEach(c=>{
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = c.name;
    tag.dataset.name = c.name;
    legend.appendChild(tag);
  });

  // rebuild the wheel itself — segment count varies by song
  generateWheelSVG();
});

let running = false;
let muted = false;
let showSkeleton = true;
let openThreshOn = OPEN_ON;
let openThreshOff = OPEN_OFF;

threshSlider.addEventListener('input', ()=>{
  const v = Number(threshSlider.value)/100;
  openThreshOn = v;
  openThreshOff = Math.max(0.05, v - 0.10);
  threshSlider.style.setProperty('--fill', threshSlider.value + '%');
});
threshSlider.style.setProperty('--fill', threshSlider.value + '%');

muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', muted);
  if(masterGain){
    masterGain.gain.setTargetAtTime(muted ? 0 : masterVolume, actx.currentTime, 0.05);
  }
});
skeletonBtn.addEventListener('click', ()=>{
  showSkeleton = !showSkeleton;
  skeletonBtn.classList.toggle('active', showSkeleton);
});
skeletonBtn.classList.add('active');

/* ============================= AUDIO ============================= */

let actx = null;
let masterGain = null;
const masterVolume = 0.85;

function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }

function ensureAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  masterGain = actx.createGain();
  masterGain.gain.value = muted ? 0 : masterVolume;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.ratio.value = 3.5;
  masterGain.connect(comp);
  comp.connect(actx.destination);
}

function startChordVoice(chordDef){
  const now = actx.currentTime;
  const groupGain = actx.createGain();
  groupGain.gain.setValueAtTime(0, now);
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2400;
  filter.Q.value = 0.3;
  groupGain.connect(filter);
  filter.connect(masterGain);

  const oscillators = [];
  chordDef.midi.forEach((m, i)=>{
    const noteGain = actx.createGain();
    noteGain.gain.value = 1/chordDef.midi.length;
    noteGain.connect(groupGain);

    const osc = actx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = midiToFreq(m);
    osc.connect(noteGain);
    osc.start(now);
    oscillators.push(osc);

    // add a soft sine an octave up for a touch of shimmer
    const osc2 = actx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = midiToFreq(m + 12);
    const g2 = actx.createGain();
    g2.gain.value = (1/chordDef.midi.length) * 0.18;
    osc2.connect(g2);
    g2.connect(groupGain);
    osc2.start(now);
    oscillators.push(osc2);
  });

  groupGain.gain.linearRampToValueAtTime(0.95, now + 0.09);

  return { gain: groupGain, oscillators, name: chordDef.name };
}

function stopChordVoice(voice, release=0.28){
  if(!voice) return;
  const now = actx.currentTime;
  voice.gain.gain.cancelScheduledValues(now);
  voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
  voice.gain.gain.linearRampToValueAtTime(0.0001, now + release);
  voice.oscillators.forEach(o=>{
    try{ o.stop(now + release + 0.05); }catch(e){}
  });
}

let currentVoice = null;
let currentChordName = null;
let isOpen = false;

function updateAudioState(selectedName, openNow){
  const chordDef = WHEEL.find(c=>c.name === selectedName);
  if(openNow && !isOpen){
    currentVoice = startChordVoice(chordDef);
    currentChordName = selectedName;
  } else if(openNow && isOpen && selectedName !== currentChordName){
    stopChordVoice(currentVoice, 0.10);
    currentVoice = startChordVoice(chordDef);
    currentChordName = selectedName;
  } else if(!openNow && isOpen){
    stopChordVoice(currentVoice, 0.30);
    currentVoice = null;
    currentChordName = null;
  }
  isOpen = openNow;
}

/* ============================= HAND TRACKING ============================= */

let handLandmarker = null;

async function setupModel(){
  loadingBar.style.width = '25%';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  loadingBar.style.width = '60%';
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.55,
    minHandPresenceConfidence: 0.55,
    minTrackingConfidence: 0.55
  });
  loadingBar.style.width = '100%';
  setTimeout(()=>{ loadingBar.style.opacity='0'; }, 400);
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let lastSegmentIdx = null;
let candidateSegmentIdx = null;
let candidateCount = 0;
let smoothOpenFrac = 0;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function computeOpenFraction(lm){
  // lm: mirrored pixel-space landmarks, array of 21 {x,y}
  const wrist = lm[0];
  const fingers = [
    { tip: lm[8],  mcp: lm[5]  }, // index
    { tip: lm[12], mcp: lm[9]  }, // middle
    { tip: lm[16], mcp: lm[13] }, // ring
    { tip: lm[20], mcp: lm[17] }, // pinky
  ];
  let sum = 0;
  fingers.forEach(f=>{
    const tipD = dist(wrist, f.tip);
    const mcpD = dist(wrist, f.mcp) || 1;
    const ratio = tipD / mcpD; // ~0.8-1.0 closed, ~1.7-2.1 open
    const frac = Math.min(1, Math.max(0, (ratio - 0.95) / (1.85 - 0.95)));
    sum += frac;
  });
  return sum / fingers.length;
}

function angleAndSegment(origin, tip){
  const dx = tip.x - origin.x;
  const dy = tip.y - origin.y;
  const angleRad = Math.atan2(dy, dx); // canvas convention: 0=east, clockwise (screen y-down)
  let angleDeg = angleRad * 180 / Math.PI;
  if(angleDeg < 0) angleDeg += 360;
  const clockAngle = (angleDeg + 90) % 360; // 0 = north, clockwise
  const segmentSize = 360 / WHEEL.length;
  const idx = Math.round(clockAngle / segmentSize) % WHEEL.length;
  return { angleRad, idx };
}

let needleVecX = 0, needleVecY = -1; // smoothed unit vector, starts pointing north

/* ============================= WHEEL: SVG + frosted-glass DOM ============================= */

// The chord wheel is a fixed HUD element — it does not follow the hand.
// It's rendered once as crisp SVG (not re-drawn on canvas each frame) sitting on a
// backdrop-filter:blur() glass panel, so it stays legible over any background.
let wheelAnchor = { x: 0, y: 0 };
let wheelRadius = 140;

const wheelGlassEl = document.getElementById('wheelGlass');
const wheelBoxEl   = document.getElementById('wheelBox');
const wedgesG      = document.getElementById('wedges');
const labelsG      = document.getElementById('labels');
const needleEl     = document.getElementById('needle');
const progressRingEl = document.getElementById('progressRing');

const WHEEL_CX = 150, WHEEL_CY = 150, OUTER_R = 140, INNER_R = OUTER_R*0.58, LABEL_R = OUTER_R*0.79;
const RING_R = 62, RING_CIRC = 2*Math.PI*RING_R;
progressRingEl.setAttribute('stroke-dasharray', String(RING_CIRC));

function polarPt(cx,cy,r,clockDeg){
  const rad = (clockDeg-90) * Math.PI/180; // 0deg = north, clockwise (matches our angle convention)
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}

const wedgeEls = [];
const labelEls = [];

function generateWheelSVG(){
  wedgesG.innerHTML = '';
  labelsG.innerHTML = '';
  wedgeEls.length = 0;
  labelEls.length = 0;

  const svgNS = 'http://www.w3.org/2000/svg';
  const segDeg = 360 / WHEEL.length;
  for(let i=0;i<WHEEL.length;i++){
    const startDeg = i*segDeg - segDeg/2;
    const endDeg = startDeg + segDeg;
    const [ox1,oy1] = polarPt(WHEEL_CX,WHEEL_CY,OUTER_R,startDeg);
    const [ox2,oy2] = polarPt(WHEEL_CX,WHEEL_CY,OUTER_R,endDeg);
    const [ix2,iy2] = polarPt(WHEEL_CX,WHEEL_CY,INNER_R,endDeg);
    const [ix1,iy1] = polarPt(WHEEL_CX,WHEEL_CY,INNER_R,startDeg);
    const d = `M ${ox1} ${oy1} A ${OUTER_R} ${OUTER_R} 0 0 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${INNER_R} ${INNER_R} 0 0 0 ${ix1} ${iy1} Z`;
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', d);
    path.setAttribute('class','wedge');
    wedgesG.appendChild(path);
    wedgeEls.push(path);

    const midDeg = startDeg + segDeg/2;
    const [lx,ly] = polarPt(WHEEL_CX,WHEEL_CY,LABEL_R,midDeg);
    const text = document.createElementNS(svgNS,'text');
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('class','wheelLabel');
    text.textContent = WHEEL[i].name;
    labelsG.appendChild(text);
    labelEls.push(text);
  }
}
generateWheelSVG();

function layoutWheelDOM(){
  const size = wheelRadius*2;
  const left = wheelAnchor.x - wheelRadius;
  const top  = wheelAnchor.y - wheelRadius;
  [wheelGlassEl, wheelBoxEl].forEach(el=>{
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.left = left+'px';
    el.style.top = top+'px';
  });
}

let lastRenderedIdx = null;

function updateWheelUI(selectedIdx, openFrac, active, needleClockDeg){
  if(selectedIdx !== lastRenderedIdx){
    if(lastRenderedIdx !== null){
      wedgeEls[lastRenderedIdx].classList.remove('selected','active');
      labelEls[lastRenderedIdx].classList.remove('selected','active');
    }
    wedgeEls[selectedIdx].classList.add('selected');
    labelEls[selectedIdx].classList.add('selected');
    lastRenderedIdx = selectedIdx;
  }
  wedgeEls[selectedIdx].classList.toggle('active', active);
  labelEls[selectedIdx].classList.toggle('active', active);
  needleEl.classList.toggle('active', active);
  progressRingEl.classList.toggle('active', active);
  progressRingEl.setAttribute('stroke-dashoffset', String(RING_CIRC * (1-openFrac)));
  needleEl.setAttribute('transform', `rotate(${needleClockDeg} ${WHEEL_CX} ${WHEEL_CY})`);
}

function setWheelVisible(visible){
  wheelGlassEl.classList.toggle('show', visible);
  wheelBoxEl.classList.toggle('show', visible);
}

/* ============================= DRAW ============================= */

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const w = rect.width, h = rect.height;
  const margin = 16;
  wheelAnchor = { x: w * 0.72, y: h * 0.44 };
  const capByScreen = Math.min(w,h) * 0.30;
  const capByRight  = w - wheelAnchor.x - margin;
  const capByTop    = wheelAnchor.y - margin;
  const capByBottom = h - wheelAnchor.y - margin;
  wheelRadius = Math.max(70, Math.min(220, Math.min(capByScreen, capByRight, capByTop, capByBottom)));
  layoutWheelDOM();
}
window.addEventListener('resize', resizeCanvas);

function drawSkeleton(lm){
  ctx.save();
  ctx.strokeStyle = 'rgba(95,227,211,0.55)';
  ctx.lineWidth = 2;
  HAND_CONNECTIONS.forEach(([a,b])=>{
    ctx.beginPath();
    ctx.moveTo(lm[a].x, lm[a].y);
    ctx.lineTo(lm[b].x, lm[b].y);
    ctx.stroke();
  });
  lm.forEach((p,i)=>{
    ctx.beginPath();
    ctx.arc(p.x, p.y, i===8 ? 5 : 3, 0, Math.PI*2);
    ctx.fillStyle = i===8 ? '#5fe3d3' : 'rgba(255,255,255,0.75)';
    ctx.fill();
  });
  ctx.restore();
}

/* ============================= MAIN LOOP ============================= */

let lastVideoTime = -1;

function pickPreferredHand(result){
  if(!result.landmarks || result.landmarks.length === 0) return null;
  if(result.landmarks.length === 1) return { lm: result.landmarks[0], handedness: result.handedness?.[0]?.[0]?.categoryName };
  // prefer the one classified as user's actual right hand.
  // MediaPipe assumes a mirrored/selfie input for its Left/Right label; since we
  // feed the raw (unmirrored) camera frame, we invert the label to match reality.
  for(let i=0;i<result.landmarks.length;i++){
    const label = result.handedness?.[i]?.[0]?.categoryName;
    const actual = label === 'Left' ? 'Right' : (label === 'Right' ? 'Left' : label);
    if(actual === 'Right') return { lm: result.landmarks[i], handedness: actual };
  }
  return { lm: result.landmarks[0], handedness: result.handedness?.[0]?.[0]?.categoryName };
}

function loop(){
  if(!running) return;
  requestAnimationFrame(loop);

  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(canvas.width !== Math.round(w*Math.min(window.devicePixelRatio||1,2))) resizeCanvas();

  // draw mirrored video frame
  ctx.save();
  ctx.clearRect(0,0,w,h);
  ctx.translate(w,0);
  ctx.scale(-1,1);
  if(video.videoWidth){
    // cover-fit
    const vRatio = video.videoWidth/video.videoHeight;
    const cRatio = w/h;
    let dw,dh,dx,dy;
    if(vRatio > cRatio){ dh=h; dw=h*vRatio; dx=(w-dw)/2; dy=0; }
    else{ dw=w; dh=w/vRatio; dx=0; dy=(h-dh)/2; }
    ctx.drawImage(video, dx, dy, dw, dh);
  }
  ctx.restore();

  // subtle dark vignette for legibility
  const grad = ctx.createRadialGradient(w/2,h*0.4,h*0.2, w/2,h*0.5,h*0.9);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  let handFound = false;

  if(handLandmarker && video.videoWidth){
    if(video.currentTime !== lastVideoTime){
      lastVideoTime = video.currentTime;
      const result = handLandmarker.detectForVideo(video, performance.now());
      const picked = pickPreferredHand(result);

      if(picked){
        handFound = true;
        // convert normalized (unmirrored) coords -> mirrored pixel space matching our drawn video
        const vRatio = video.videoWidth/video.videoHeight;
        const cRatio = w/h;
        let dw,dh,dx,dy;
        if(vRatio > cRatio){ dh=h; dw=h*vRatio; dx=(w-dw)/2; dy=0; }
        else{ dw=w; dh=w/vRatio; dx=0; dy=(h-dh)/2; }

        const lm = picked.lm.map(p=>{
          const px = dx + p.x*dw;
          const py = dy + p.y*dh;
          return { x: w - px, y: py }; // mirror x
        });

        const openFracRaw = computeOpenFraction(lm);
        smoothOpenFrac += (openFracRaw - smoothOpenFrac) * 0.35;

        // Selection is based on where the index fingertip actually is on screen,
        // relative to the fixed wheel center — like a joystick pivot. This makes it
        // track your fingertip directly, not the rotation of your wrist/palm.
        const { angleRad, idx: rawIdx } = angleAndSegment(wheelAnchor, lm[8]);
        needleVecX += (Math.cos(angleRad) - needleVecX) * 0.3;
        needleVecY += (Math.sin(angleRad) - needleVecY) * 0.3;
        let needleAngleDeg = Math.atan2(needleVecY, needleVecX) * 180 / Math.PI;
        if(needleAngleDeg < 0) needleAngleDeg += 360;
        const needleClockDeg = (needleAngleDeg + 90) % 360; // 0 = north, clockwise — matches SVG needle geometry
        if(rawIdx === candidateSegmentIdx){
          candidateCount++;
        } else {
          candidateSegmentIdx = rawIdx;
          candidateCount = 1;
        }
        if(candidateCount >= SEGMENT_HOLD_FRAMES || lastSegmentIdx === null){
          lastSegmentIdx = candidateSegmentIdx;
        }

        const openNow = isOpen ? (smoothOpenFrac > openThreshOff) : (smoothOpenFrac > openThreshOn);
        const selectedName = WHEEL[lastSegmentIdx].name;

        if(!muted) updateAudioState(selectedName, openNow);
        else { /* keep visuals live even if muted, but ensure audio silent */ if(isOpen) updateAudioState(selectedName, false); }

        if(showSkeleton) drawSkeleton(lm);
        setWheelVisible(true);
        updateWheelUI(lastSegmentIdx, smoothOpenFrac, openNow, needleClockDeg);

        // aim line: fixed wheel hub -> actual fingertip position on screen
        ctx.save();
        ctx.strokeStyle = openNow ? 'rgba(95,227,211,0.9)' : 'rgba(242,184,75,0.85)';
        ctx.lineWidth = 2;
        ctx.setLineDash([2,6]);
        ctx.beginPath();
        ctx.moveTo(wheelAnchor.x, wheelAnchor.y);
        ctx.lineTo(lm[8].x, lm[8].y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // UI readout
        readout.classList.add('show');
        chordVal.textContent = selectedName;
        openVal.textContent = Math.round(smoothOpenFrac*100) + '%';
        chordChip.classList.toggle('playing', openNow);
        openChip.classList.toggle('playing', openNow);
        legend.querySelectorAll('.tag').forEach(t=>{
          t.classList.toggle('on', t.dataset.name === selectedName);
        });

        handStatus.textContent = (picked.handedness === 'Right' ? 'right hand' : (picked.handedness ? picked.handedness.toLowerCase()+' hand' : 'hand')) + ' detected';
      }
    } else {
      handFound = lastSegmentIdx !== null && readout.classList.contains('show');
    }
  }

  if(!handFound){
    readout.classList.remove('show');
    setWheelVisible(false);
    handStatus.textContent = 'no hand';
    if(isOpen) updateAudioState(currentChordName || WHEEL[0].name, false);
    candidateSegmentIdx = null;
    candidateCount = 0;
  }

  liveMark.classList.toggle('live', handFound);
}

/* ============================= START / STOP ============================= */

let stream = null;

async function start(){
  startBtn.disabled = true;
  startBtn.textContent = 'Loading model…';
  errBox.style.display = 'none';
  try{
    if(!handLandmarker) await setupModel();

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    ensureAudio();
    if(actx.state === 'suspended') await actx.resume();

    resizeCanvas();
    running = true;
    placeholder.style.display = 'none';
    startBtn.textContent = 'Stop camera';
    startBtn.classList.add('stop');
    startBtn.disabled = false;
    requestAnimationFrame(loop);
  } catch(err){
    console.error(err);
    startBtn.disabled = false;
    startBtn.textContent = 'Start camera';
    errBox.style.display = 'block';
    errBox.textContent = 'Could not start: ' + (err && err.message ? err.message : err) +
      '. Camera access needs a secure context (https) and permission — if this preview blocks it, try opening the downloaded file directly in Chrome.';
  }
}

function stop(){
  running = false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  if(isOpen) updateAudioState(currentChordName || WHEEL[0].name, false);
  placeholder.style.display = 'flex';
  startBtn.textContent = 'Start camera';
  startBtn.classList.remove('stop');
  liveMark.classList.remove('live');
  readout.classList.remove('show');
  setWheelVisible(false);
  handStatus.textContent = 'no hand';
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

startBtn.addEventListener('click', ()=>{
  if(running) stop(); else start();
});

resizeCanvas();
</script>
</body>
</html>
